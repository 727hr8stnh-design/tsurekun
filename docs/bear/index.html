<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1e201b">
<title>WHITE BEAR | DANCE VIEWER</title>
<meta name="description" content="しろくまの3DダンスをiPhoneのSafariで。指で回して、2種類のダンスを再生できます。">
<style>
:root{color-scheme:dark;--bg:#1c201c;--ink:#f4f0e8;--muted:#aaa89d;--accent:#beca8c;--border:#50594a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--ink)}
body{min-height:100svh;display:flex;flex-direction:column}header{padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
mark{background:none;color:var(--accent)}.logo{font-size:19px;font-weight:850;letter-spacing:.14em}.logo small{display:block;letter-spacing:.24em;font-size:9px;color:var(--muted);margin-top:2px;font-weight:650}.chip{font-size:10px;color:var(--accent);border:1px solid var(--border);padding:8px 10px;border-radius:40px;letter-spacing:.12em}
main{width:100%;max-width:800px;margin:0 auto;flex:1;display:flex;flex-direction:column}.scene{position:relative;min-height:300px;height:min(60svh,670px);background:radial-gradient(ellipse at 50% 62%,#e8e4d9 0%,#d4d5c7 55%,#a9af9e 100%);overflow:hidden;border-radius:20px;margin:0 10px}
model-viewer{display:block;width:100%;height:100%;outline:0;--poster-color:transparent;--progress-bar-color:#67794c;touch-action:none}
.watermark{position:absolute;top:14px;left:16px;color:#34382f;font-size:11px;letter-spacing:.16em;font-weight:750;pointer-events:none}.instructions{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#5a6058;font-size:11px;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4e5a48;pointer-events:none;letter-spacing:.1em;font-weight:700}.loaded #loading{display:none}
.panel{padding:22px 20px 18px}.eyebrow{margin:0 0 8px;font-size:11px;color:var(--accent);letter-spacing:.2em}.title{font-size:26px;line-height:1.15;letter-spacing:.06em;margin:0 0 10px;font-weight:800}.subtitle{font-size:12px;color:var(--muted);margin:0 0 20px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{appearance:none;border:1px solid var(--border);background:#30372d;color:var(--ink);min-height:50px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:wait}button.active{background:var(--accent);border-color:var(--accent);color:#1e2719}.secondary{background:transparent;color:#ddd9cf}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.note{margin:14px 0 0;font-size:11px;color:var(--muted);line-height:1.6}.status{min-height:20px;padding:10px 0 0;color:#b6c792;font-size:11px}.footer{padding:0 20px calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-size:10px;letter-spacing:.12em;color:#8f9789}
@media(min-width:750px){header{max-width:800px;width:100%;margin:0 auto}.scene{height:min(67vh,680px)}.panel{padding-left:36px;padding-right:36px}}
</style>
<script type="module" src="../vendor/model-viewer.min.js"></script>
</head><body>
<header><div class="logo">WHITE BEAR<small>3D DANCE VIEWER · V0.2</small></div><span class="chip">3D DANCE</span></header>
<main><section class="scene" id="scene"><div class="watermark">DANCE TEST / 02</div>
<model-viewer id="viewer" src="model.glb?v=7" reveal="auto" alt="白いぬいぐるみ風・しろくまの3Dキャラクター。ダンスする様子を回転して見られます。" camera-controls disable-pan touch-action="none" interpolation-decay="150" environment-image="neutral" exposure="1.05" shadow-intensity="0.6" shadow-softness="1" camera-orbit="0deg 80deg auto" animation-name="01_Sway_4s" autoplay interaction-prompt="none"></model-viewer>
<div id="loading">3Dを読み込み中…</div><div class="instructions">1本指：回転　／　2本指：拡大・縮小</div></section>
<section class="panel"><p class="eyebrow">ANIMATED CHARACTER · DANCE PROTOTYPE</p><h1 class="title">しろくま <mark>おしゃべり</mark>。</h1><p class="subtitle">ダンスを切り替えて、360°どこからでも確認できます。</p>
<section aria-label="おしゃべり" style="margin-bottom:20px">
<label for="voice-style">声の雰囲気</label>
<select id="voice-style" style="display:block;width:100%;margin:8px 0 14px;padding:12px;border-radius:10px;font:inherit;font-size:16px;background:#fffaf0;color:#252820">
<option value="soft">ふんわり・かわいい</option><option value="bright">元気・かわいい</option><option value="calm">落ち着いた声</option></select>
<label for="words">しろくまに話してほしいセリフ</label>
<textarea id="words" maxlength="300" rows="3" style="display:block;width:100%;margin:10px 0;padding:12px;border-radius:12px;font:inherit;font-size:16px;background:#fffaf0;color:#252820">こんにちは！ぼくはしろくまだよ。今日も会えてうれしいな。一緒にのんびりしようね。</textarea>
<div class="actions"><button id="speak" disabled type="button">🐻 話して</button><button id="quiet" disabled type="button">声を止める</button></div>
<p id="speech-status" role="status" class="note">ボタンを押すと日本語で話します。セリフは自由に変えられます。</p>
</section><div class="controls"><button class="active" id="groove" disabled type="button">01 · SWAY</button><button id="breakbeat" disabled type="button">02 · HELLO</button></div>
<div class="actions"><button class="secondary" id="toggle" disabled type="button">一時停止</button><button class="secondary" id="share" type="button">リンクを共有</button></div>
<div class="status" id="status" aria-live="polite">読み込み中</div><p class="note">写真4枚を参考に形を起こした、ぬいぐるみ風の3D試作です。毛並みや細部は簡略化しています。</p></section></main><footer>WHITE BEAR · PHOTO STUDY v0.1</footer>
<script>
(function(){
const v=document.getElementById('viewer'),scene=document.getElementById('scene'),s=document.getElementById('status'),a=document.getElementById('groove'),b=document.getElementById('breakbeat'),toggle=document.getElementById('toggle');
let ready=false;
const timeout=setTimeout(()=>{if(!ready){document.getElementById('loading').textContent='読み込みに時間がかかっています。ページを再読み込みしてください';s.textContent='通信または3D表示の状態を確認してください';}},45000);
function setAnim(name){if(!ready)return;v.animationName=name;v.currentTime=0;v.play();toggle.textContent='一時停止';a.classList.toggle('active',name==='01_Sway_4s');b.classList.toggle('active',name==='02_Hello_4s');s.textContent=name.startsWith('01_')?'SWAY を再生中':'HELLO を再生中'}
a.addEventListener('click',()=>setAnim('01_Sway_4s'));b.addEventListener('click',()=>setAnim('02_Hello_4s'));
toggle.addEventListener('click',()=>{if(v.paused){v.play();toggle.textContent='一時停止';s.textContent='ダンス再生中';}else{v.pause();toggle.textContent='再生する';s.textContent='一時停止中';}});
v.addEventListener('load',()=>{clearTimeout(timeout);ready=true;[a,b,toggle].forEach(el=>el.disabled=false);scene.classList.add('loaded');s.textContent='読み込み完了 · '+'2種類の動きとおしゃべり';v.play()});v.addEventListener('error',()=>{clearTimeout(timeout);ready=false;[a,b,toggle].forEach(el=>el.disabled=true);s.textContent='読み込みエラー：通信状況を確認してください。';document.getElementById('loading').textContent='3Dを読み込めませんでした';});
document.getElementById('share').addEventListener('click',async()=>{const data={title:'しろくま ダンスビューアー',text:'しろくまの3Dダンスを見てみて！',url:location.href};try{if(navigator.share){await navigator.share(data)}else if(navigator.clipboard && location.protocol==='https:'){await navigator.clipboard.writeText(location.href);s.textContent='URLをコピーしました';}else{s.textContent='Safariの共有メニューからLINEに送れます';}}catch(e){if(e.name!=='AbortError')s.textContent='Safariの共有メニューから送ってください';}});
})();
</script><script src="speech.js?v=4"></script></body></html>
